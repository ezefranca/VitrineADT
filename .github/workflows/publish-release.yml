name: Publicar galeria

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write
  issues: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Obter a versão publicada
        uses: actions/checkout@v4

      - name: Atualizar totais de reações positivas
        run: node scripts/fetch-reactions.mjs --output .generated/reactions.json
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Gerar o site estático
        run: node scripts/build-site.mjs --reactions .generated/reactions.json

      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Preparar arquivos para publicação
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist

      - name: Publicar no GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Fechar as Issues publicadas sem bloqueá-las
        continue-on-error: true
        run: node scripts/mark-published.mjs dist/data/apps.json
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ github.event.release.tag_name || github.ref_name }}
          SITE_URL: ${{ steps.deployment.outputs.page_url }}
