name: Verificar código do projeto

on:
  pull_request:
    paths:
      - ".github/**"
      - "data/**"
      - "scripts/**"
      - "site/**"
      - "tests/**"
      - "package.json"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - run: npm test
      - run: npm run check
      - run: npm run build:demo
