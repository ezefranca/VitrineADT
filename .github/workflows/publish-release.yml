name: Publicar galeria

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write
  issues: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Obter a versão publicada
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Atualizar totais de reações positivas
        run: node scripts/fetch-reactions.mjs --output .generated/reactions.json
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Gerar o site estático
        run: node scripts/build-site.mjs --reactions .generated/reactions.json

      - name: Configurar GitHub Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5

      - name: Preparar arquivos para publicação
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: dist

      - name: Publicar no GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4

      - name: Fechar as Issues publicadas sem bloqueá-las
        continue-on-error: true
        run: node scripts/mark-published.mjs dist/data/apps.json
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ github.event.release.tag_name || github.ref_name }}
          SITE_URL: ${{ steps.deployment.outputs.page_url }}
