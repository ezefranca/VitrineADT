name: Colocar aplicativo aprovado na fila

on:
  issues:
    types: [labeled]

permissions:
  contents: write
  issues: write

concurrency:
  group: catalog-writes
  cancel-in-progress: false

jobs:
  queue:
    if: github.event.label.name == 'moderation/approved'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Obter o catálogo mais recente
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 1

      - name: Revalidar e importar o aplicativo
        id: import
        run: node scripts/import-approved-app.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Verificar o catálogo antes de gravar
        run: npm run build

      - name: Gravar o snapshot aprovado
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- data/apps public/icons
          if git diff --cached --quiet; then
            echo "Nenhuma alteração necessária."
          else
            git commit -m "catalog: queue app from issue #${{ github.event.issue.number }}"
            git push
          fi

      - name: Marcar como aguardando publicação
        run: node scripts/mark-queued.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Devolver para moderação se a importação falhar
        if: failure()
        run: node scripts/mark-import-failed.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
