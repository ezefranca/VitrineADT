name: Criar catálogo inicial

on:
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency:
  group: catalog-writes
  cancel-in-progress: false

jobs:
  seed:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Obter o catálogo mais recente
        uses: actions/checkout@v3
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 1

      - name: Preparar etiquetas de moderação
        run: node scripts/setup-labels.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Verificar episódios, criar Issues e montar a base
        run: node scripts/seed-catalog.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Verificar o site antes de gravar
        run: npm test && npm run build

      - name: Gravar o catálogo inicial
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- data/apps public/icons
          if git diff --cached --quiet; then
            echo "Nenhuma alteração necessária."
          else
            git commit -m "catalog: seed apps from ADT 484-493"
            git push
          fi
